name: payment-engine-ci

on:
  push:
    branches:
      - main
      - payment-engine-sdlc-automation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and generate SBOM
        run: mvn --batch-mode clean verify
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyclonedx-sbom
          path: target/bom.*
