spring:
  application:
    name: mfg-payment-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mfg_payments}
    username: ${SPRING_DATASOURCE_USERNAME:mfg_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:3000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mfg:
  payment-engine:
    idempotency:
      cleanup-fixed-delay-ms: ${IDEMPOTENCY_CLEANUP_FIXED_DELAY_MS:900000}

logging:
  level:
    root: INFO
    com.aif.mfg.paymentengine: INFO
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
